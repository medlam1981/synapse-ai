
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synapse AI Server</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@300;400;500;700&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --cyan: #00e5ff;
      --cyan-glow: rgba(0, 229, 255, 0.4);
      --red: #ff3d00;
      --text: #e0e0e0;
      --dim: #757575;
    }
    body {
      background-color: var(--bg);
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .terminal-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .terminal-scrollbar::-webkit-scrollbar-thumb {
      background: #1a1a1a;
      border-radius: 10px;
    }
    .cyan-glow {
      text-shadow: 0 0 15px var(--cyan-glow);
    }
    .box-glow {
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
    }
    
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    .scanline-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, transparent, rgba(0, 229, 255, 0.05) 50%, transparent);
      animation: scanline 4s linear infinite;
      pointer-events: none;
      z-index: 5;
    }
    .neural-grid {
      background-image: 
        linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
